name: Release build

# On a version tag: prove the build is reproducible, then attach the reference build (manifest + build-info) to the
# GitHub release for that tag. The council compares its own clean build at the tag against this artefact before
# attesting anything.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  reference-build:
    name: Reproducible reference build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci --ignore-scripts
      - run: scripts/fetch-tool.sh foundry
      - run: npm run verify:reproducible
      - name: Package
        run: |
          tar -czf "release-build-${GITHUB_REF_NAME}.tar.gz" release-build
          sha256sum "release-build-${GITHUB_REF_NAME}.tar.gz" > "release-build-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("release-build-${GITHUB_REF_NAME}.tar.gz" "release-build-${GITHUB_REF_NAME}.tar.gz.sha256")
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber \
            || gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --notes "Reference build for ${GITHUB_REF_NAME}: manifest.json and build-info."
