name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HARDHAT_DISABLE_TELEMETRY: "true"

# Supply chain: actions pinned to commit SHAs; exact Node and Python; npm packages verified by lockfile integrity with
# install scripts disabled; Python tools from a --require-hashes lock (ci/requirements.txt); forge and Aderyn from
# release assets whose sha256 is pinned in tools.lock (scripts/fetch-tool.sh).

jobs:
  test:
    name: Lint, typecheck, test (incl. EIP-170 size + interface freeze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: npm
      # forge-std is a public git dependency recorded as git+ssh in the lockfile; fetch it over https.
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci --ignore-scripts
      - run: npm run lint:sol
      # The TS tests are typed by the ABI declarations Hardhat writes into artifacts/, so build before typechecking.
      - run: npx hardhat build
      - run: npm run typecheck
      # Default and production profiles share one compiler config, so ContractSizes.t.sol checks deployed sizes.
      - run: npm test
      # Isolation mode shifts nonces: guards against fixtures that predict addresses from the deployer's nonce.
      - run: npx hardhat test solidity --test-profile isolated

  analysis:
    name: Format, Slither + Aderyn gates, Halmos, upgrade safety, reproducibility (PRs into main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci --ignore-scripts
      - run: scripts/fetch-tool.sh foundry
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.15
      - run: pip install --require-hashes -r ci/requirements.txt
      - run: npm run fmt:check
      - run: slither .
      # Second static analyser (Cyfrin Aderyn): fails on any finding not excluded in aderyn.toml or suppressed inline
      # with a reason. The binary is the sha256-pinned release asset from tools.lock.
      - run: scripts/fetch-tool.sh aderyn
      - run: npm run aderyn
      - run: npm run test:halmos
      - run: npm run validate:upgrades
      # Same bytecode from 2 clean production builds, the default profile and forge; TokenProxy matches ProxyDeployer.
      # About 11 minutes on a hosted runner, so only on PRs into main; tag pushes run it in release.yml before publishing.
      - if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: npm run verify:reproducible
